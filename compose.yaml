name: audeniq-foundation-dev
x-runtime: &runtime
  build:
    context: .
    dockerfile: deploy/Dockerfile
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=16m]
  networks: [backend, egress]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: audeniq_owner
      POSTGRES_DB: audeniq_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set local owner password}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set local API password}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set local worker password}
    volumes:
      - pg_dev:/var/lib/postgresql/data
      - ./deploy/bootstrap.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
      - ./deploy/grants.sql:/opt/audeniq/grants.sql:ro
    ports: ['127.0.0.1:5432:5432']
    networks: [backend]
    command: ['postgres', '-c', 'max_connections=40', '-c', 'shared_buffers=128MB']
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audeniq_owner -d audeniq_dev']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *runtime
    command: [audeniq-migrate]
    environment:
      DATABASE_URL: postgres://audeniq_owner:${POSTGRES_PASSWORD}@postgres/audeniq_dev
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
  grants:
    image: postgres:17-bookworm
    command: [psql, -h, postgres, -U, audeniq_owner, -d, audeniq_dev, -v, ON_ERROR_STOP=1, -f, /opt/grants.sql]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['./deploy/grants.sql:/opt/grants.sql:ro']
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *runtime
    command: [audeniq-api]
    environment:
      APP_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      API_BIND: 0.0.0.0:8080
      EDGE_SERVICE_SECRET: ${EDGE_SERVICE_SECRET:?set random service secret}
      DATABASE_URL: postgres://audeniq_api:${API_DB_PASSWORD}@postgres/audeniq_dev
      STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://unconfigured.invalid}
      S3_BUCKET: ${S3_BUCKET:-unconfigured}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUST_LOG: info
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      grants: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1.0
  worker:
    <<: *runtime
    command: [audeniq-worker]
    environment:
      DATABASE_URL: postgres://audeniq_worker:${WORKER_DB_PASSWORD}@postgres/audeniq_dev
      QUEUE_INTERACTIVE_CONCURRENCY: '1'
      QUEUE_QC_CONCURRENCY: '0'
      QUEUE_RIGHTS_CONCURRENCY: '0'
      QUEUE_DISTRIBUTION_CONCURRENCY: '0'
      QUEUE_FINANCE_CONCURRENCY: '0'
      RUST_LOG: info
    depends_on:
      grants: {condition: service_completed_successfully}
    mem_limit: 384m
    cpus: 0.5
volumes:
  pg_dev:
networks:
  backend: {internal: true}
  egress: {}
