[package]
name = "audeniq-studio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "Element", "Event", "EventTarget", "HtmlInputElement", "HtmlSelectElement", "HtmlFormElement", "HtmlElement", "Node", "NodeList", "File", "FileList", "Blob", "Headers", "Request", "RequestInit", "RequestCredentials", "RequestMode", "Response", "Location"] }
