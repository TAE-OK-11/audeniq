[package]
name = "audeniq-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.0"
sha1 = "0.11.0"
# Already built for rustls/sqlx TLS. Used for WebAuthn and ID-token signature
# checks, Apple client secrets, and RSA-SHA256 request signing in the host
# secret tool (GCP service-account JWT, OCI API key).
aws-lc-rs = "1.18.1"
hmac = "0.13.0"
base64 = "0.23.1"
subtle = "2.6.1"
# Email notifications over SMTP (AWS SES, OCI Email Delivery): STARTTLS with
# rustls on aws-lc-rs and the Mozilla roots, no native-tls.
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli"] }
url = "2.5.8"
async-trait = "0.1.92"
tracing = "0.1.44"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "catch-panic"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow = "1.0.104"
jsonschema = { version = "0.58.1", default-features = false, features = ["idna"] }  # 내장 스키마만 — 원격 $ref 받기 끔
rust_decimal = { version = "1.43.0", features = ["serde", "db-postgres"] }
rustfft = "6.4.1"
quick-xml = "0.42.0"
# Profanity lists: one multi-pattern pass per text; already in the tree via regex.
aho-corasick = "1.1.5"
unicode-normalization = "0.1.25"
libc = "0.2.189"
unicode-security = "0.1.2"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.9.0"
# Global allocator for the long-running api/worker binaries (see src/bin). Chosen
# by measuring the real API (docs/BACKEND_RESOURCE_PERFORMANCE.md "Allocator"):
# about half the resident memory of mimalloc (start 23 vs 43 MB, idle after load
# 31 vs 58 MB, peak 122 vs 175 MB) at the same request rate. ARM builds use
# 64 KiB pages (deploy/build-target.sh) so one image runs on any page size.
tikv-jemallocator = "0.7.0"
tokio-stream = "0.1.19"

[dev-dependencies]
# Independent oracle for the in-crate MD5 (crate::md5) tests only.
md5_reference = { package = "md-5", version = "0.11.0" }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
unicode-normalization = "0.1.25"
[build-dependencies]
serde_json = "1.0.151"

[[bench]]
name = "backend_resources"
harness = false

[[bench]]
name = "crypto_resources"
harness = false
