[package]
name = "audeniq-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
url = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
jsonschema = { version = "0.58", default-features = false, features = ["idna"] }  # 내장 스키마만 — 원격 $ref 받기 끔
rust_decimal = { version = "1", features = ["serde", "db-postgres"] }
rustfft = "6"
quick-xml = "0.42"
unicode-normalization = "0.1"
libc = "0.2"
unicode-security = "0.1.2"
aes-gcm = "0.11"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
unicode-normalization = "0.1"
[build-dependencies]
serde_json = "1"
