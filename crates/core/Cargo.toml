[package]
name = "audeniq-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
subtle = "2.6.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli", "zstd"] }
url = "2.5.8"
async-trait = "0.1.92"
tracing = "0.1.44"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-zstd", "compression-gzip", "catch-panic"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
jsonschema = { version = "0.58.1", default-features = false, features = ["idna"] }  # 내장 스키마만 — 원격 $ref 받기 끔
rust_decimal = { version = "1.43.0", features = ["serde", "db-postgres"] }
rustfft = "6.4.1"
quick-xml = "0.42.0"
unicode-normalization = "0.1.25"
libc = "0.2.189"
unicode-security = "0.1.2"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.9.0"
# Global allocator for the long-running api/worker binaries (see src/bin): lower RSS
# than glibc malloc's per-thread arenas under tokio, and faster small allocs.
mimalloc = { version = "0.1", default-features = false }
[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
unicode-normalization = "0.1.25"
[build-dependencies]
serde_json = "1.0.151"
