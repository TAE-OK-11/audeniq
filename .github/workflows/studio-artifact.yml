name: Studio release artifact
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable main commit to build for release
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/studio/.bun-version
      - name: Test and build exact Studio release
        working-directory: web/studio/app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Worker and D1 content tests
        working-directory: web/studio
        run: bun test test/
      - name: Record source commit
        run: git rev-parse HEAD > web/studio/RELEASE_COMMIT
      - uses: actions/upload-artifact@v7
        with:
          name: studio-release-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            web/studio/public/
            web/studio/worker.js
            web/studio/wrangler.jsonc
            web/studio/RELEASE_COMMIT
