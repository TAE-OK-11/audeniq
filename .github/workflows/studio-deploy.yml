name: Studio deploy
# main에 Studio(web/studio) 변경이 올라가면 테스트 → 빌드 → Cloudflare Worker(audeniq-studio) 배포.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit), CLOUDFLARE_ACCOUNT_ID
# 수동 실행: Actions → Studio deploy → Run workflow
on:
  push:
    branches: [main]
    paths:
      - web/studio/**
  workflow_dispatch:
permissions:
  contents: read
# 배포는 겹치지 않게 하나씩, 뒤에 온 것이 마지막으로 반영된다
concurrency:
  group: studio-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/studio/.bun-version
      - name: Test and build Studio
        working-directory: web/studio/app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Worker and D1 content tests
        working-directory: web/studio
        run: bun test test/
      - name: Apply D1 migrations (content)
        working-directory: web/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.141.0 d1 migrations apply audeniq-content --remote
      - name: Deploy audeniq-studio
        working-directory: web/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.141.0 deploy
