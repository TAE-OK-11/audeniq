name: Studio deploy
# Studio(web/studio)가 바뀌면 어느 브랜치든 테스트 → 빌드를 돌리고,
# main일 때만 D1 마이그레이션 적용 → Cloudflare Worker(audeniq-studio) 배포까지 한다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit), CLOUDFLARE_ACCOUNT_ID
# 수동 실행: Actions → Studio deploy → Run workflow (main에서 실행하면 배포)
on:
  push:
    paths:
      - web/studio/**
      - .github/workflows/studio-deploy.yml
  pull_request:
    paths:
      - web/studio/**
      - .github/workflows/studio-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
# main 배포는 겹치지 않게 하나씩(취소 없음), 다른 브랜치는 새 푸시가 이전 실행을 취소
concurrency:
  group: studio-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 643f41fe3ea99f34dc3657742caea5b2bb4b31a4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/studio/.bun-version
      - name: Test and build Studio
        working-directory: web/studio/app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Worker and D1 content tests
        working-directory: web/studio
        run: bun test test/
      - name: Record immutable release source
        run: git rev-parse HEAD > web/studio/RELEASE_COMMIT
      - name: Package CI-tested Studio release
        uses: actions/upload-artifact@v7
        with:
          name: studio-release-643f41fe3ea99f34dc3657742caea5b2bb4b31a4
          retention-days: 7
          if-no-files-found: error
          path: |
            web/studio/public/
            web/studio/worker.js
            web/studio/wrangler.jsonc
            web/studio/RELEASE_COMMIT
      - name: Apply D1 migrations (content)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: web/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.141.0 d1 migrations apply audeniq-content --remote
      - name: Deploy audeniq-studio
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: web/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.141.0 deploy
