name: Studio deploy
# Studio(web/studio)가 바뀐 main PR에서 테스트 → 빌드를 돌리고,
# main일 때만 빌드 결과를 production 서버로 올린다 (deploy/studio-release.sh, deploy/STUDIO_SERVING.md).
# CloudFront forwards to the Rust HTTPS origin, which serves UI files and API.
# Legacy Worker tests remain regression coverage; this workflow never publishes Workers.
# 필요한 production 환경 Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (백엔드 배포와 같은 값)
# 수동 실행: Actions → Studio deploy → Run workflow (main에서 실행하면 배포)
on:
  push:
    branches: [main]
    paths:
      - web/studio/**
      - web/shared/**
      - deploy/aws/**
      - deploy/studio-release.sh
      - .github/workflows/studio-deploy.yml
  pull_request:
    branches: [main]
    paths:
      - web/studio/**
      - web/shared/**
      - deploy/aws/**
      - deploy/studio-release.sh
      - .github/workflows/studio-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
# main 배포는 겹치지 않게 하나씩(취소 없음), 다른 브랜치는 새 푸시가 이전 실행을 취소
concurrency:
  group: studio-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: web/studio/.bun-version
      - name: Test and build Studio
        working-directory: web/studio/app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Worker tests
        working-directory: web/studio
        run: bun test test/
      - name: AWS (CloudFront) config tests
        run: node --experimental-strip-types --test deploy/aws/test/aws.test.ts
      - name: Package Studio build
        # .br 사이드카(빌드가 만든 brotli)까지 함께. 링크·바깥 경로는 서버가 거절한다
        run: |
          test -f web/studio/public/index.html
          tar -C web/studio/public -czf studio.tar.gz .
          echo "Studio 빌드: $(tar -tzf studio.tar.gz | wc -l) 파일, $(du -h studio.tar.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-build
          path: studio.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: studio-release
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/audeniq' }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: studio-build
      - name: Check deploy settings
        id: settings
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$KNOWN" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          # 시크릿이 하나도 없으면 자동 배포만 건너뛴다(백엔드 배포와 같은 규칙). 일부만 있거나 수동 실행이면 실패한다.
          if [ "$EVENT" = push ] && [ "$missing" = " DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::production 환경 시크릿이 없어 Studio 배포를 건너뜁니다. 빌드 결과(studio-build)를 받아 서버에서 ./studio-release.sh install로 올리세요."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::production 환경 시크릿이 없어요:$missing (deploy/STUDIO_SERVING.md 참고)"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: SSH setup
        if: steps.settings.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Upload and switch release
        if: steps.settings.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/studio/releases'"
          scp -i ~/.ssh/deploy_key deploy/studio-release.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -i ~/.ssh/deploy_key studio.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/studio/upload-$SHA.tar.gz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x studio-release.sh && ./studio-release.sh install '$SHA' 'studio/upload-$SHA.tar.gz'; status=\$?; rm -f 'studio/upload-$SHA.tar.gz'; exit \$status"
          echo "Studio 배포됨: \`${SHA:0:7}\` → \`$DEPLOY_HOST:$DEPLOY_PATH/studio/current\` (되돌리기: \`./studio-release.sh rollback\`)" >> "$GITHUB_STEP_SUMMARY"
