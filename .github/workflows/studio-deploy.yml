name: Studio deploy
# Studio(web/studio)가 바뀐 main PR에서 테스트 → 빌드를 돌리고,
# main일 때만 Cloudflare Worker(audeniq-studio)로 배포한다. Worker는 화면 서빙과 /api 전달만 하고,
# 공지·이벤트·서버 점검은 백엔드 Postgres에 있다 (crates/core/src/site_content.rs).
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID
# 수동 실행: Actions → Studio deploy → Run workflow (main에서 실행하면 배포)
on:
  push:
    branches: [main]
    paths:
      - web/studio/**
      - web/shared/**
      - deploy/aws/**
      - .github/workflows/studio-deploy.yml
  pull_request:
    branches: [main]
    paths:
      - web/studio/**
      - web/shared/**
      - deploy/aws/**
      - .github/workflows/studio-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
# main 배포는 겹치지 않게 하나씩(취소 없음), 다른 브랜치는 새 푸시가 이전 실행을 취소
concurrency:
  group: studio-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/studio/.bun-version
      - name: Test and build Studio
        working-directory: web/studio/app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Worker tests
        working-directory: web/studio
        run: bun test test/
      - name: AWS (CloudFront) config tests
        run: node --experimental-strip-types --test deploy/aws/test/aws.test.ts
      - name: Deploy audeniq-studio
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: web/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.141.0 deploy
