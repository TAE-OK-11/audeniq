name: IndexNow — submit AUDENIQ public URLs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-audeniq-production
  cancel-in-progress: false

jobs:
  submit:
    name: Verify live site, then submit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate SEO assets and published URL manifest
        working-directory: web/landing
        run: npm run check

      - name: Verify live site matches this revision
        working-directory: web/landing
        run: npm run verify:live

      - name: Submit public URLs directly to IndexNow
        working-directory: web/landing
        run: npm run indexnow
