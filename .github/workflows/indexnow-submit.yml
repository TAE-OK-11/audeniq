name: IndexNow — submit AUDENIQ public URLs

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Submit only pages changed since this git ref (e.g. the previously deployed commit). Empty = all published pages."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: indexnow-audeniq-production
  cancel-in-progress: false

jobs:
  submit:
    name: Verify live site, then submit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate SEO assets and published URL manifest
        working-directory: web/landing
        run: npm run check

      - name: Verify live site matches this revision
        working-directory: web/landing
        run: npm run verify:live

      - name: Submit public URLs directly to IndexNow
        working-directory: web/landing
        env:
          INDEXNOW_SINCE: ${{ inputs.since }}
        run: npm run indexnow
