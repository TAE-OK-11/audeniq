name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ephemeral-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check Rust formatting
        id: formatting
        continue-on-error: true
        run: |
          cargo fmt --all
          git diff --exit-code
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p audeniq-core --bins
      - run: cargo test --locked -p audeniq-core -- --test-threads=2
      - run: cargo build --locked -p audeniq-edge --target wasm32-unknown-unknown
      - run: cargo test --locked -p audeniq-studio
      - run: cargo clippy --locked -p audeniq-studio --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked -p audeniq-studio --lib --release --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo run --locked -p audeniq-studio --bin studio-pack
      - run: wasm-bindgen --target web --out-dir web/studio/dist/pkg target/wasm32-unknown-unknown/release/audeniq_studio.wasm
      - uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - name: Browser integration against local API
        env:
          APP_ENV: development
          APP_ORIGIN: http://localhost:5173
          EDGE_SERVICE_SECRET: ephemeral-browser-service-secret-at-least-32-characters
          API_BIND: 127.0.0.1:8080
          STORAGE_ENABLED: 'false'
        run: |
          cargo run --locked -p audeniq-core --bin audeniq-migrate
          target/debug/audeniq-api > /tmp/api.log 2>&1 &
          target/debug/audeniq-dev-web > /tmp/web.log 2>&1 &
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 -H "X-Audeniq-Service:$EDGE_SERVICE_SECRET" http://127.0.0.1:8080/ready
          target/debug/audeniq-browser-smoke
      - name: Browser diagnostics
        if: failure()
        run: cat /tmp/api.log /tmp/web.log /tmp/chromedriver.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: studio-static-assets
          path: web/studio/dist
      - name: Enforce formatting result
        if: always() && steps.formatting.outcome == 'failure'
        run: exit 1
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ephemeral-owner-ci
      API_DB_PASSWORD: ephemeral-api-ci
      WORKER_DB_PASSWORD: ephemeral-worker-ci
      EDGE_SERVICE_SECRET: ephemeral-ci-service-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Check API readiness
        run: curl --fail --retry 15 --retry-connrefused --retry-delay 2 -H "X-Audeniq-Service:$EDGE_SERVICE_SECRET" http://127.0.0.1:8080/ready
      - name: Runtime logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs api worker migrate grants
      - name: Remove disposable CI environment
        if: always()
        run: docker compose down -v
