name: audeniq-production
x-runtime: &runtime
  image: ${AUDENIQ_IMAGE:?set verified immutable API image}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=16m]
  networks: [backend, egress]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  postgres:
    restart: unless-stopped
    # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker, so the
    # volume mounts one level up. pg_prod (17) stays for rollback; move data
    # with ./pg-upgrade.sh once (deploy.sh refuses to start until then).
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: audeniq_owner
      POSTGRES_DB: audeniq_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set production owner password}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set production API password}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set production worker password}
    volumes:
      - pg18_prod:/var/lib/postgresql
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
      - ./grants.sql:/opt/audeniq/grants.sql:ro
    networks: [backend]
    # 1 vCPU / 1 GB SSD 서버 기준. 메모리 상한(768m) 안에서 캐시를 넉넉히 쓰고,
    # 병렬 쿼리·JIT는 끈다(코어 1개에서는 오히려 느리고 메모리를 먹는다).
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=1GB
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
    shm_size: 128m
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audeniq_owner -d audeniq_prod']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *runtime
    command: [audeniq-migrate]
    environment:
      DATABASE_URL: postgres://audeniq_owner:${POSTGRES_PASSWORD}@postgres/audeniq_prod
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
  grants:
    image: postgres:18-trixie
    command: [psql, -h, postgres, -U, audeniq_owner, -d, audeniq_prod, -v, ON_ERROR_STOP=1, -f, /opt/grants.sql]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['./grants.sql:/opt/grants.sql:ro']
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
  # Transaction pooling in front of PostgreSQL for the api/worker roles.
  # migrate, grants and the worker's LISTEN connect to postgres directly
  # (they need a session). Built here from deploy/pgbouncer (Debian package).
  pgbouncer:
    restart: unless-stopped
    build: ./pgbouncer
    image: audeniq-pgbouncer:local
    environment:
      PGBOUNCER_DB: audeniq_prod
      POSTGRES_HOST: postgres
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set production API password}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set production worker password}
      PGBOUNCER_POOL_SIZE: '${PGBOUNCER_POOL_SIZE:-10}'
      PGBOUNCER_MAX_DB_CONN: '${PGBOUNCER_MAX_DB_CONN:-30}'
    read_only: true
    tmpfs: ['/run/pgbouncer:size=1m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      grants: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6432']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    restart: unless-stopped
    <<: *runtime
    command: [audeniq-api]
    # SIGTERM drains in-flight requests; upload completion hashes a master
    # of up to 512 MiB, so allow more than the default 10 s.
    stop_grace_period: 30s
    environment:
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?set exact HTTPS Studio origin}
      API_BIND: 0.0.0.0:8080
      EDGE_SERVICE_SECRET: ${EDGE_SERVICE_SECRET:?set random service secret}
      PAYOUT_ACCOUNT_KEY: ${PAYOUT_ACCOUNT_KEY:?set 64-hex AES-256 key for payout account numbers}
      DATABASE_URL: postgres://audeniq_api:${API_DB_PASSWORD}@pgbouncer:6432/audeniq_prod
      DATABASE_POOLER: pgbouncer
      STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://unconfigured.invalid}
      S3_BUCKET: ${S3_BUCKET:-unconfigured}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # ALAC uploads are converted to FLAC here (source + result on disk),
      # never in the 16 MiB /tmp tmpfs.
      TMPDIR: /var/tmp/audeniq
      RUST_LOG: info
    volumes:
      - api_tmp:/var/tmp/audeniq
    depends_on:
      pgbouncer: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
  worker:
    restart: unless-stopped
    <<: *runtime
    command: [audeniq-worker]
    # SIGTERM drains in-flight jobs for WORKER_DRAIN_SECONDS, then releases
    # unfinished leases; the grace period must exceed the drain window.
    stop_grace_period: 45s
    environment:
      DATABASE_URL: postgres://audeniq_worker:${WORKER_DB_PASSWORD}@pgbouncer:6432/audeniq_prod
      DATABASE_POOLER: pgbouncer
      # LISTEN needs a session: direct to postgres, not through the pooler.
      DATABASE_LISTEN_URL: postgres://audeniq_worker:${WORKER_DB_PASSWORD}@postgres/audeniq_prod
      WORKER_MAX_IN_FLIGHT: '${WORKER_MAX_IN_FLIGHT:-3}'
      DATABASE_MAX_CONNECTIONS: '${DATABASE_MAX_CONNECTIONS:-8}'
      JOB_LEASE_SECONDS: '${JOB_LEASE_SECONDS:-300}'
      WORKER_DRAIN_SECONDS: '${WORKER_DRAIN_SECONDS:-30}'
      QUEUE_INTERACTIVE_CONCURRENCY: '1'
      QUEUE_QC_CONCURRENCY: '1'
      QUEUE_RIGHTS_CONCURRENCY: '1'
      QUEUE_DISTRIBUTION_CONCURRENCY: '1'
      QUEUE_FINANCE_CONCURRENCY: '1'
      QUEUE_DELIVERY_CONCURRENCY: '2'
      # Workers read the frozen masters for Stage 1 QC and packaging; they
      # need the same bucket as the API. Analysis temp files go to TMPDIR (a
      # volume), never the 16 MiB /tmp tmpfs.
      # Workers only read (HEAD/GET): give them a read-only token
      # (S3_WORKER_*), so the process that opens user files with ffmpeg
      # cannot write or delete objects. Falls back to the API token.
      STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://unconfigured.invalid}
      S3_BUCKET: ${S3_BUCKET:-unconfigured}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
      S3_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
      TMPDIR: /var/tmp/audeniq
      RUST_LOG: info
    volumes:
      - worker_tmp:/var/tmp/audeniq
    depends_on:
      pgbouncer: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 1.5
  tunnel:
    image: ${CLOUDFLARED_IMAGE:?set tested cloudflared image digest}
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    # cloudflared는 종료 신호를 받으면 처리 중인 요청을 최대 30초 기다린다(기본 grace-period).
    # Docker 기본 10초면 그 전에 강제 종료되므로 여유를 준다.
    stop_grace_period: 35s
    secrets: [tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    depends_on: [api]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
secrets:
  tunnel_token:
    file: ./tunnel-token
volumes:
  pg18_prod:
  worker_tmp:
  api_tmp:
networks:
  backend: {internal: true}
  egress: {}
