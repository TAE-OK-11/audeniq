<title>AUDENIQ STUDIO - 서버에 문제가 발생했습니다</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:"Audeniq Sans","Audeniq Sans Full",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:#fff;color:#171B29;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 16px;word-break:keep-all;overflow-wrap:anywhere}.brand{display:inline-flex;align-items:center;gap:10px;color:#171B29;text-decoration:none;font-size:22px;font-weight:800;letter-spacing:-.02em}.brand span{font-size:11px;letter-spacing:.14em;color:#3B63F3;background:#F5F8FF;border-radius:8px;padding:6px 10px}.brand span.aq-logo{background:transparent;color:#171B29;font-size:22px;font-weight:800;letter-spacing:0;padding:0;border-radius:0;font-family:"Audeniq Sans","Audeniq Sans Full",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-feature-settings:"ss20";}main{width:100%;max-width:520px;margin-bottom:6vh;padding:40px 22px 30px;border-radius:28px;background:#F5F8FF;text-align:center}.icon{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 18px;background:#fff;color:#3B63F3;box-shadow:0 0 0 8px #3b63f30f}.code{display:table;margin:0 auto 10px;padding:2px 9px;border-radius:32px;background:#fff;color:#3B63F3;font-size:12px;font-weight:800;letter-spacing:.02em}h1{margin:0;font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.02em}p{margin:8px auto 0;max-width:420px;color:#646E84;font-size:14px;line-height:1.7}.actions{margin-top:26px}a.btn{display:inline-block;min-width:120px;padding:12px 20px;border-radius:14px;background:#3B63F3;color:#fff;text-decoration:none;font-size:14px;font-weight:700}a.btn:hover{background:#2C56E0}a.sub{display:block;margin-top:16px;color:#4D5970;font-size:14px;text-decoration:none}a:focus-visible{outline:3px solid #6F91FF;outline-offset:4px}@media(min-width:768px){main{padding:56px 32px 40px}h1{font-size:23px}p{font-size:15px}}</style>
