version: 2.1
# AUDENIQ 백엔드 이미지 — GitHub Actions의 .github/workflows/backend-image.yml과 같은 흐름.
# amd64·arm64를 각 아키텍처 머신에서 빌드해 GHCR에 digest로 올리고, 검증된 digest만
# ghcr.io/tae-ok-11/audeniq:sha-<커밋>(·main·latest) 공용 매니페스트로 묶는다.
# main에서는 그 뒤 "approve-deploy" 승인을 누르면 production 서버에 deploy.sh로 배포한다.
#
# CircleCI 프로젝트 설정 → Contexts에 "audeniq-production"을 만들고 다음 환경 변수를 넣는다:
#   GHCR_USER            GitHub 아이디
#   GHCR_TOKEN           GitHub PAT (write:packages, read:packages)
#   DEPLOY_HOST          서버 주소
#   DEPLOY_USER          SSH 사용자 (docker 권한)
#   DEPLOY_SSH_KEY       배포 전용 SSH 개인키를 base64 한 줄로 (base64 -w0 < key)
#   DEPLOY_KNOWN_HOSTS   ssh-keyscan <서버> 결과를 base64 한 줄로 (호스트 키 고정)
#   DEPLOY_PATH          (선택) 기본 /opt/audeniq
#   CLOUDFLARE_API_TOKEN   프론트엔드 배포 (Workers Scripts:Edit, D1:Edit)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#
# frontend 워크플로: Studio·Admin·랜딩·설문을 어느 브랜치든 테스트·빌드하고 main에서만 Workers로 배포한다.

parameters:
  force:
    description: 백엔드 파일이 바뀌지 않았어도 이미지를 만든다 (수동 실행용)
    type: boolean
    default: false
  target:
    description: 실행할 워크플로 (수동 실행용) — all, backend, frontend
    type: enum
    enum: [all, backend, frontend]
    default: all
  apply_migrations:
    description: Studio·설문 D1 마이그레이션을 변경이 없어도 적용한다 (수동 실행용)
    type: boolean
    default: false

commands:
  skip-unless-changed:
    description: 이 푸시에서 paths(정규식)에 맞는 파일이 바뀌지 않았으면 작업을 성공으로 끝낸다
    parameters:
      paths:
        type: string
    steps:
      - run:
          name: Check changes
          command: |
            if [ "<< pipeline.parameters.force >>" = true ]; then exit 0; fi
            base="<< pipeline.git.base_revision >>"
            head="<< pipeline.git.revision >>"
            # GitHub App 트리거는 base_revision을 비워 보낼 수 있다: 그때는 바로 앞 커밋(병합이면 PR 전체)과 비교
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse -q --verify "$head~1" || true)
              [ -n "$base" ] || exit 0
            fi
            if git diff --name-only "$base" "$head" | grep -Eq '<< parameters.paths >>'; then exit 0; fi
            echo "관련 변경 없음 — 건너뜀"
            circleci-agent step halt
  skip-unless-backend-changed:
    steps:
      - skip-unless-changed:
          paths: '^(Cargo\.toml|Cargo\.lock|crates/core/|config/|migrations/|deploy/(Dockerfile|build-target\.sh|check-cpu\.sh|deploy\.sh|audeniq-photo\.rev|audeniq-qc\.rev|install-audeniq-photo\.sh|install-audeniq-qc\.sh|clamd\.conf|freshclam\.conf|update-antivirus\.py|pgbouncer/|compose\.production\.yaml)|\.dockerignore$)'
  setup-bun:
    description: web/<app>/.bun-version의 Bun 설치
    parameters:
      version_file:
        type: string
    steps:
      - run:
          name: Install Bun
          command: |
            v=$(tr -d '[:space:]' < << parameters.version_file >>)
            curl -fsSL https://bun.sh/install | bash -s "bun-v$v"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
  migrations-changed:
    description: D1 마이그레이션 폴더가 바뀌었으면 /tmp/apply-migrations 파일을 만든다
    parameters:
      dir:
        type: string
    steps:
      - run:
          name: Check D1 migration changes
          command: |
            base="<< pipeline.git.base_revision >>"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse -q --verify "<< pipeline.git.revision >>~1" || true)
            fi
            if [ "<< pipeline.parameters.apply_migrations >>" = true ]; then
              touch /tmp/apply-migrations
            elif [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null \
                 && ! git diff --quiet "$base" "<< pipeline.git.revision >>" -- << parameters.dir >>; then
              touch /tmp/apply-migrations
            fi
            [ -f /tmp/apply-migrations ] && echo "D1 마이그레이션 적용함" || echo "D1 마이그레이션 변경 없음"
  image-name:
    steps:
      - run:
          name: Image name
          command: |
            # GitHub App 프로젝트의 CIRCLE_PROJECT_USERNAME은 CircleCI 조직 이름이라 GitHub 소유자와 다르다
            echo "export IMAGE=${IMAGE_REPO:-ghcr.io/tae-ok-11/audeniq}" >> "$BASH_ENV"
  ghcr-login:
    steps:
      - run:
          name: GHCR login
          command: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

jobs:
  build:
    parameters:
      arch:
        type: enum
        enum: [amd64, arm64]
      cpu:
        type: string
      resource_class:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    steps:
      - checkout
      - skip-unless-backend-changed
      - image-name
      - ghcr-login
      - run:
          name: Build and push by digest
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            docker buildx create --name audeniq --driver docker-container --use >/dev/null
            # 아키텍처마다 같은 태그를 두고 다투지 않도록 digest로만 올린다
            docker buildx build \
              --file deploy/Dockerfile \
              --platform linux/<< parameters.arch >> \
              --build-arg CARGO_PROFILE=release \
              --build-arg TARGET_CPU=<< parameters.cpu >> \
              --label org.opencontainers.image.title=audeniq \
              --label "org.opencontainers.image.revision=$CIRCLE_SHA1" \
              --label io.audeniq.target-cpu=<< parameters.cpu >> \
              --cache-from "type=registry,ref=$IMAGE:buildcache-<< parameters.arch >>" \
              --cache-to "type=registry,ref=$IMAGE:buildcache-<< parameters.arch >>,mode=max" \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file /tmp/build-meta.json \
              .
            digest=$(jq -er '."containerimage.digest"' /tmp/build-meta.json)
            mkdir -p /tmp/audeniq-digests
            printf '%s\n' "$digest" > /tmp/audeniq-digests/<< parameters.arch >>
            echo "export REF=$IMAGE@$digest" >> "$BASH_ENV"
      - run:
          name: Smoke test runtime dependencies and image metadata
          command: |
            set -euo pipefail
            docker pull "$REF"
            test "$(docker image inspect --format '{{.Architecture}}' "$REF")" = << parameters.arch >>
            docker run --rm --entrypoint sh -e EXPECTED_ARCH=<< parameters.arch >> -e EXPECTED_CPU=<< parameters.cpu >> "$REF" -c '
              set -e
              for b in audeniq-api audeniq-worker audeniq-migrate audeniq-admin audeniq-qc audeniq-photo sftp python3 xmllint clamd; do command -v "$b"; done
              for b in exiftool tesseract zbarimg pdftoppm; do if command -v "$b"; then echo "$b must not ship in the runtime image"; exit 1; fi; done
              if command -v ffmpeg; then echo "ffmpeg must not ship in the runtime image"; exit 1; fi
              test "$(cat /usr/local/share/audeniq/target-arch)" = "$EXPECTED_ARCH"
              test "$(cat /usr/local/share/audeniq/target-cpu)" = "$EXPECTED_CPU"
              test "$(id -u)" = 10001
              audeniq-qc capabilities
              audeniq-photo --version'
      - run:
          name: Verify binary execution and parser sandbox on native CPU
          command: |
            docker run --rm --network none --cap-drop ALL --read-only --security-opt no-new-privileges \
              --entrypoint audeniq-admin "$REF" upload-sandbox-check
      - persist_to_workspace:
          root: /tmp
          paths:
            - audeniq-digests/<< parameters.arch >>

  image:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - skip-unless-backend-changed
      - attach_workspace:
          at: /tmp
      - image-name
      - ghcr-login
      - run:
          name: Publish portable manifest
          command: |
            set -euo pipefail
            tags=(-t "$IMAGE:sha-$CIRCLE_SHA1")
            if [ "$CIRCLE_BRANCH" = main ]; then tags+=(-t "$IMAGE:main" -t "$IMAGE:latest"); fi
            docker buildx imagetools create "${tags[@]}" \
              "$IMAGE@$(cat /tmp/audeniq-digests/amd64)" "$IMAGE@$(cat /tmp/audeniq-digests/arm64)"
            # 공용 매니페스트에 실행 가능한 두 아키텍처가 모두 있는지 확인
            docker buildx imagetools inspect "$IMAGE:sha-$CIRCLE_SHA1" --raw > /tmp/audeniq-manifest.json
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' /tmp/audeniq-manifest.json
            digest=$(docker buildx imagetools inspect "$IMAGE:sha-$CIRCLE_SHA1" --format '{{json .Manifest}}' | jq -er '.digest')
            printf '%s\n' "$digest" > /tmp/audeniq-digests/portable
            echo "Deploy: ./deploy.sh $IMAGE@$digest"
      - persist_to_workspace:
          root: /tmp
          paths:
            - audeniq-digests/portable

  deploy:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - skip-unless-backend-changed
      - attach_workspace:
          at: /tmp
      - image-name
      - run:
          name: Check deploy settings
          command: |
            missing=""
            for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_USER GHCR_TOKEN; do
              [ -n "${!v:-}" ] || missing="$missing $v"
            done
            if [ -n "$missing" ]; then
              echo "audeniq-production 컨텍스트에 환경 변수가 없어요:$missing (.circleci/config.yml 머리말 참고)" >&2
              exit 1
            fi
      - run:
          name: SSH setup
          command: |
            install -m 700 -d ~/.ssh
            printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - run:
          name: Copy deploy files of this commit
          # compose·grants·bootstrap은 이미지(마이그레이션)와 같은 커밋이어야 한다. 비밀 파일은 서버에만 있다.
          command: |
            path=${DEPLOY_PATH:-/opt/audeniq}
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$path'"
            scp -i ~/.ssh/deploy_key deploy/compose.production.yaml deploy/bootstrap.sql deploy/grants.sql deploy/deploy.sh deploy/check-cpu.sh deploy/pg-upgrade.sh deploy/kms-keyring.py deploy/backup.sh deploy/restore-backup.sh \
              "$DEPLOY_USER@$DEPLOY_HOST:$path/"
            scp -r -i ~/.ssh/deploy_key deploy/pgbouncer "$DEPLOY_USER@$DEPLOY_HOST:$path/"
      - run:
          name: Deploy
          command: |
            path=${DEPLOY_PATH:-/opt/audeniq}
            ref="$IMAGE@$(cat /tmp/audeniq-digests/portable)"
            # deploy.sh가 표준입력의 토큰으로 GHCR에 로그인해 받고, 끝나면 로그아웃한다
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$path' && chmod +x deploy.sh pg-upgrade.sh && GHCR_USER='$GHCR_USER' GHCR_TOKEN_STDIN=1 ./deploy.sh '$ref'" \<<< "$GHCR_TOKEN"
            echo "배포됨: $ref → $DEPLOY_HOST:$path"

  # ── 프론트엔드 (Cloudflare Workers) ─────────────────────────────
  # 어느 브랜치든 테스트·빌드, main일 때만 배포. CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID는 Context에 둔다.
  studio:
    docker:
      - image: cimg/node:22.17
    environment:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - checkout
      - skip-unless-changed:
          paths: '^(web/studio/|web/shared/)'
      - setup-bun:
          version_file: web/studio/.bun-version
      - run:
          name: Test and build Studio
          working_directory: web/studio/app
          command: |
            bun install --frozen-lockfile
            bun run test
            bun run build
      - run:
          name: Worker and D1 content tests
          working_directory: web/studio
          command: bun test test/
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - migrations-changed:
                dir: web/studio/migrations
            - run:
                name: Apply D1 migrations (content)
                working_directory: web/studio
                command: |
                  [ -f /tmp/apply-migrations ] || exit 0
                  npx --yes wrangler@4.141.0 d1 migrations apply audeniq-content --remote
            - run:
                name: Deploy audeniq-studio
                working_directory: web/studio
                command: npx --yes wrangler@4.141.0 deploy

  admin:
    docker:
      - image: cimg/node:22.17
    environment:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - checkout
      - skip-unless-changed:
          paths: '^(web/admin/|web/shared/|web/studio/app/build/retain-assets\.ts|web/studio/worker\.js|web/studio/test/worker\.test\.mjs)'
      - setup-bun:
          version_file: web/admin/.bun-version
      - run:
          name: Type check and build
          working_directory: web/admin
          command: |
            bun install --frozen-lockfile
            bun run test
            bun run build
      - run:
          name: Shared content Worker tests
          command: bun test web/studio/test/worker.test.mjs
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Deploy audeniq-admin
                working_directory: web/admin
                command: npx --yes wrangler@4.141.0 deploy

  landing:
    docker:
      - image: cimg/node:22.17
    environment:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - checkout
      - skip-unless-changed:
          paths: '^(web/landing/)'
      - run:
          name: SEO build and tests
          working_directory: web/landing
          command: npm run check
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Deploy audeniq-web
                working_directory: web/landing
                command: npx --yes wrangler@4.141.0 deploy

  survey:
    docker:
      - image: cimg/node:22.17
    environment:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - checkout
      - skip-unless-changed:
          paths: '^(web/survey/)'
      - setup-bun:
          version_file: web/studio/.bun-version
      - run:
          name: Test and build
          working_directory: web/survey
          command: |
            bun run test
            bun run build
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Preflight (실제 D1·Turnstile 설정 확인)
                working_directory: web/survey
                command: |
                  # wrangler.jsonc에 실제 값이 들어가기 전에는 배포하지 않고 이유만 남긴다
                  if ! bun run preflight; then
                    echo "설문 설정이 아직 완료되지 않아 배포를 건너뜀"
                    circleci-agent step halt
                  fi
            - migrations-changed:
                dir: web/survey/migrations
            - run:
                name: Apply D1 migrations (survey)
                working_directory: web/survey
                command: |
                  [ -f /tmp/apply-migrations ] || exit 0
                  npx --yes wrangler@4.141.0 d1 migrations apply audeniq-survey --remote
            - run:
                name: Deploy audeniq-survey
                working_directory: web/survey
                command: npx --yes wrangler@4.141.0 deploy

workflows:
  backend-image:
    when:
      not:
        equal: [frontend, << pipeline.parameters.target >>]
    jobs:
      - build:
          name: build-amd64
          context: audeniq-production
          arch: amd64
          cpu: x86-64
          resource_class: large
          filters: &main-only
            branches:
              only: main
      - build:
          name: build-arm64
          context: audeniq-production
          arch: arm64
          cpu: generic
          resource_class: arm.large
          filters: *main-only
      - image:
          context: audeniq-production
          requires: [build-amd64, build-arm64]
          filters: *main-only
      # CircleCI 화면에서 승인을 눌러야 production에 배포된다
      - approve-deploy:
          type: approval
          requires: [image]
          filters: *main-only
      - deploy:
          context: audeniq-production
          requires: [approve-deploy]
          filters: *main-only

  frontend:
    when:
      not:
        equal: [backend, << pipeline.parameters.target >>]
    jobs:
      - studio:
          context: audeniq-production
      - admin:
          context: audeniq-production
      - landing:
          context: audeniq-production
      - survey:
          context: audeniq-production
